services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: php
        environment:
            DB_HOST: mysql
            DB_NAME: badminton
            DB_USER: badminton
            DB_PASS: badminton
            APP_URL: http://localhost:8000
        ports:
            - '8000:80'
        volumes:
            - ./:/var/www/html
            - composer_vendor:/var/www/html/vendor
        working_dir: /var/www/html
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: mysql:8.0
        container_name: mysql
        restart: always
        command: --default-authentication-plugin=mysql_native_password
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: badminton
            MYSQL_USER: badminton
            MYSQL_PASSWORD: badminton
        ports:
            - '3306:3306'
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot']
            interval: 5s
            timeout: 5s
            retries: 20

    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        container_name: phpmyadmin
        restart: always
        ports:
            - '8080:80'
        environment:
            PMA_HOST: mysql
        depends_on:
            - mysql

    mobile:
        image: node:22-bookworm-slim
        working_dir: /workspace/mobile
        command: >-
            sh -c "if [ ! -x node_modules/.bin/expo ] || [ package-lock.json -nt node_modules/.package-lock.json ]; then npm ci; fi
            && npx expo start --host lan --port 8081"
        environment:
            EXPO_PUBLIC_API_URL: ${EXPO_PUBLIC_API_URL:-http://10.0.2.2:8000}
            EXPO_PACKAGER_PROXY_URL: ${EXPO_PACKAGER_PROXY_URL:-http://10.0.2.2:8081}
            EXPO_TOKEN: ${EXPO_TOKEN:-}
        ports:
            - '8081:8081'
        volumes:
            - ./mobile:/workspace/mobile
            - mobile_node_modules:/workspace/mobile/node_modules
        depends_on:
            - php
        restart: unless-stopped
        tty: true

volumes:
    mysql_data:
    composer_vendor:
    mobile_node_modules:
